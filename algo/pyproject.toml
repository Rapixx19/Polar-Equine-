[project]
name = "lafattoria-algo"
version = "0.1.0"
description = "La Fattoria algorithm service — HRV / TRIMP / recovery / gait detection for sport horses"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "neurokit2>=0.2.11",
    "scipy>=1.12.0",
    "numpy>=1.26.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "mypy>=1.13",
    "ruff>=0.7",
]

[tool.uv]
package = false

[tool.mypy]
strict = true
python_version = "3.11"
files = ["service", "algorithms", "tests"]
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
